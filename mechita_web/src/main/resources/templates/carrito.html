<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - Piuranos Mechita</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: topbar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main style="margin-top: calc(var(--topbar-height) + var(--navbar-height)); background: var(--mechita-cream); min-height: 70vh; padding: 3rem 0;">
    <div class="container">

        <h2 class="mb-4" style="font-family: 'Playfair Display', serif; font-weight: 800;">Mi carrito</h2>

        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <div class="alert alert-warning" th:if="${cliente == null}">
            Solo las cuentas de cliente pueden realizar compras.
        </div>

        <div th:if="${cliente != null and carrito.items.isEmpty()}" class="text-center text-muted py-5">
            <i class="bi bi-cart-x fs-1 d-block mb-2 opacity-50"></i>
            Tu carrito está vacío.
            <div><a th:href="@{/productos}" class="btn btn-dark mt-3" style="border-radius: 50px;">Ver productos</a></div>
        </div>

        <div class="row g-4" th:if="${cliente != null and !carrito.items.isEmpty()}">

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm" style="border-radius: 20px;">
                    <div class="card-body p-4">
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead class="table-light">
                                <tr>
                                    <th>Producto</th>
                                    <th class="text-end">Precio</th>
                                    <th class="text-center">Cant.</th>
                                    <th class="text-end">Subtotal</th>
                                    <th></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="item : ${carrito.items}">
                                    <td class="fw-bold" th:text="${item.producto.nombre}">Producto</td>
                                    <td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(item.producto.precio, 1, 2)}">S/ 0.00</td>
                                    <td class="text-center" th:text="${item.cantidad}">1</td>
                                    <td class="text-end fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}">S/ 0.00</td>
                                    <td class="text-end">
                                        <form th:action="@{/carrito/quitar}" method="post">
                                            <input type="hidden" name="idProducto" th:value="${item.producto.idProducto}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" aria-label="Quitar">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card border-0 shadow-sm" style="border-radius: 20px;">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted">Total</span>
                            <span class="fs-4 fw-bold" style="color: var(--mechita-brown);" th:text="'S/ ' + ${#numbers.formatDecimal(carrito.total, 1, 2)}">S/ 0.00</span>
                        </div>

                        <div class="alert alert-warning small" th:if="${direcciones.isEmpty()}">
                            Registra una dirección en <a th:href="@{/perfil}">tu perfil</a> para confirmar el pedido.
                        </div>

                        <form th:action="@{/carrito/confirmar}" method="post" th:if="${!direcciones.isEmpty()}">
                            <label class="form-label text-muted small fw-bold">Dirección de entrega</label>
                            <select name="idDireccion" class="form-select mb-3" required>
                                <option th:each="d : ${direcciones}" th:value="${d.idDireccion}"
                                        th:text="${d.direccion + ' - ' + d.distrito.nombre}">Dirección</option>
                            </select>

                            <label class="form-label text-muted small fw-bold">Método de pago</label>
                            <select name="idMetodoPago" class="form-select mb-4" required>
                                <option th:each="m : ${metodos}" th:value="${m.idMetodoPago}" th:text="${m.nombre}">Método</option>
                            </select>

                            <button type="submit" class="btn btn-dark w-100" style="border-radius: 50px;">
                                <i class="bi bi-bag-check"></i> Confirmar pedido
                            </button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
