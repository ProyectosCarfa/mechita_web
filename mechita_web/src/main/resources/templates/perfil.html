<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Piuranos Mechita</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: topbar}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="perfil-page" style="margin-top: calc(var(--topbar-height) + var(--navbar-height)); background: var(--mechita-cream); min-height: 70vh; padding: 3rem 0;">
    <div class="container">

        <div class="row g-4">

            <!-- COLUMNA IZQUIERDA: DATOS DEL USUARIO -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm" style="border-radius: 20px; overflow: hidden;">
                    <div class="card-header bg-white text-center py-4 border-0">
                        <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle mb-3" style="width: 100px; height: 100px; color: var(--mechita-brown);">
                            <i class="bi bi-person-fill" style="font-size: 4rem;"></i>
                        </div>
                        <h4 class="mb-1" style="font-family: 'Playfair Display', serif; font-weight: 800;" th:text="${cliente != null ? cliente.nombres + ' ' + cliente.apellidos : 'Usuario Mechita'}">Nombre</h4>
                        <p class="text-muted mb-0" th:text="${usuario.correo}">correo@ejemplo.com</p>

                        <span class="badge mt-3" th:classappend="${usuario.rol.nombre == 'ADMIN' ? 'bg-danger' : 'bg-success'}" th:text="${usuario.rol.nombre}">ROL</span>
                    </div>
                    <div class="card-body p-4">
                        <h6 class="text-uppercase text-muted fw-bold mb-3" style="font-size: 0.8rem; letter-spacing: 1px;">Información Personal</h6>

                        <div class="d-flex align-items-center mb-3">
                            <i class="bi bi-envelope me-3" style="color: var(--mechita-brown); font-size: 1.2rem;"></i>
                            <div>
                                <small class="text-muted d-block">Correo</small>
                                <span th:text="${usuario.correo}">correo</span>
                            </div>
                        </div>

                        <div class="d-flex align-items-center mb-3" th:if="${cliente != null}">
                            <i class="bi bi-telephone me-3" style="color: var(--mechita-brown); font-size: 1.2rem;"></i>
                            <div>
                                <small class="text-muted d-block">Teléfono</small>
                                <span th:text="${cliente.telefono != null ? cliente.telefono : 'No registrado'}">999999999</span>
                            </div>
                        </div>

                        <div class="d-flex align-items-center mb-3" th:if="${cliente != null}">
                            <i class="bi bi-card-text me-3" style="color: var(--mechita-brown); font-size: 1.2rem;"></i>
                            <div>
                                <small class="text-muted d-block">DNI</small>
                                <span th:text="${cliente.dni != null ? cliente.dni : 'No registrado'}">12345678</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: DATOS EDITABLES Y COMPRAS -->
            <div class="col-lg-8">

                <!-- SECCIÓN EDITAR DATOS DE ENVÍO -->
                <div class="card border-0 shadow-sm mb-4" style="border-radius: 20px;">
                    <div class="card-body p-4">
                        <h5 class="mb-3" style="font-family: 'Playfair Display', serif; font-weight: 800;">Mis Datos de Envío</h5>

                        <!-- Mensajes de éxito o error -->
                        <div th:if="${success}" class="alert alert-success py-2">
                            <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
                        </div>
                        <div th:if="${error}" class="alert alert-danger py-2">
                            <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
                        </div>

                        <form th:action="@{/perfil/actualizar}" method="post" th:if="${cliente != null}">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Teléfono</label>
                                    <input type="text" name="telefono" class="form-control" th:value="${cliente.telefono}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Dirección Principal</label>
                                    <input type="text" name="direccion" class="form-control" th:value="${direccionPrincipal != null ? direccionPrincipal.direccion : ''}" maxlength="200" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Distrito</label>
                                    <select name="idDistrito" class="form-select" required>
                                        <option value="" disabled th:selected="${direccionPrincipal == null}">Selecciona un distrito</option>
                                        <option th:each="d : ${distritos}" th:value="${d.idDistrito}" th:text="${d.nombre}"
                                                th:selected="${direccionPrincipal != null and direccionPrincipal.distrito.idDistrito == d.idDistrito}">Distrito</option>
                                    </select>
                                </div>
                                <div class="col-12 text-end">
                                    <button type="submit" class="btn btn-dark" style="border-radius: 50px;">
                                        <i class="bi bi-save"></i> Guardar Cambios
                                    </button>
                                </div>
                            </div>
                        </form>
                        <div th:if="${cliente == null}" class="text-muted">
                            No tienes un perfil de cliente asociado.
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN MIS COMPRAS -->
                <div class="card border-0 shadow-sm" style="border-radius: 20px;">
                    <div class="card-body p-4">
                        <h5 class="mb-3" style="font-family: 'Playfair Display', serif; font-weight: 800;">Historial de Compras</h5>

                        <div th:if="${pedidos.isEmpty()}" class="text-muted text-center py-4">
                            <i class="bi bi-bag-x fs-1 d-block mb-2 opacity-50"></i>
                            Aún no has realizado ninguna compra.
                        </div>

                        <div class="table-responsive" th:if="${!pedidos.isEmpty()}">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                <tr>
                                    <th>Pedido</th>
                                    <th>Fecha</th>
                                    <th>Estado</th>
                                    <th class="text-end">Total</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="pedido : ${pedidos}">
                                    <td><span class="fw-bold" th:text="'#' + ${pedido.idPedido}">#123</span></td>
                                    <td th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy')}">15/10/2026</td>
                                    <td>
                                        <span class="badge bg-success bg-opacity-25 text-success" th:text="${pedido.estado.nombre}">Estado</span>
                                    </td>
                                    <td class="text-end fw-bold" style="color: var(--mechita-brown);" th:text="'S/ ' + ${#numbers.formatDecimal(pedido.total, 1, 2)}">S/ ---</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
