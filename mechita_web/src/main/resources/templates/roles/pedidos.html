<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Mechita E.I.R.L</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Pedidos</h3>
        <a th:href="@{/admin}" class="btn btn-outline-dark btn-sm"><i class="bi bi-arrow-left"></i> Panel</a>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="table-responsive">
        <table class="table table-hover align-middle bg-white">
            <thead class="table-light">
            <tr>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>Fecha</th>
                <th>Entrega</th>
                <th class="text-end">Total</th>
                <th>Pago</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pedidos}">
                <td class="fw-bold" th:text="'#' + ${p.idPedido}">#1</td>
                <td th:text="${p.cliente.nombres + ' ' + p.cliente.apellidos}">Cliente</td>
                <td th:text="${#temporals.format(p.fechaPedido, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                <td th:text="${p.direccion.direccion + ', ' + p.direccion.distrito.nombre}">Dirección</td>
                <td class="text-end fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(p.total, 1, 2)}">S/ 0.00</td>
                <td th:text="${p.pago != null ? p.pago.metodoPago.nombre : 'Sin pago'}">Pago</td>
                <td>
                    <form th:action="@{/admin/pedidos/estado}" method="post" class="d-flex gap-2">
                        <input type="hidden" name="idPedido" th:value="${p.idPedido}">
                        <select name="estado" class="form-select form-select-sm">
                            <option th:each="e : ${estados}" th:value="${e.nombre}" th:text="${e.nombre}"
                                    th:selected="${e.idEstado == p.estado.idEstado}">ESTADO</option>
                        </select>
                        <button type="submit" class="btn btn-dark btn-sm"><i class="bi bi-check2"></i></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${pedidos.isEmpty()}">
                <td colspan="7" class="text-center text-muted py-4">Aún no hay pedidos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
