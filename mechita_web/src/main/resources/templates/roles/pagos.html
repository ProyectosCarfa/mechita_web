<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos - Mechita E.I.R.L</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Pagos</h3>
        <a th:href="@{/admin}" class="btn btn-outline-dark btn-sm"><i class="bi bi-arrow-left"></i> Panel</a>
    </div>

    <div class="alert alert-success">
        Total recaudado:
        <strong th:text="'S/ ' + ${#numbers.formatDecimal(totalRecaudado, 1, 2)}">S/ 0.00</strong>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle bg-white">
            <thead class="table-light">
            <tr>
                <th>Pago</th>
                <th>Pedido</th>
                <th>Método</th>
                <th>Fecha</th>
                <th>Referencia</th>
                <th class="text-end">Monto</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${pagos}">
                <td th:text="'#' + ${p.idPago}">#1</td>
                <td th:text="'#' + ${p.pedido.idPedido}">#1</td>
                <td th:text="${p.metodoPago.nombre}">Método</td>
                <td th:text="${#temporals.format(p.fechaPago, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                <td th:text="${p.referencia != null ? p.referencia : '-'}">-</td>
                <td class="text-end fw-bold" th:text="'S/ ' + ${#numbers.formatDecimal(p.monto, 1, 2)}">S/ 0.00</td>
            </tr>
            <tr th:if="${pagos.isEmpty()}">
                <td colspan="6" class="text-center text-muted py-4">Aún no hay pagos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
